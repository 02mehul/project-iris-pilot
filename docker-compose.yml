services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: iris_user
      POSTGRES_PASSWORD: iris_password
      POSTGRES_DB: iris_pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris_user -d iris_pilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
